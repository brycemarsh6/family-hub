# The gauntlet, run by GitHub on every pull request and every push to main.
#
# This is the same set of commands every mission has always had to pass
# locally (see CLAUDE.md's gauntlet sections) — now enforced by a machine
# that can't forget, on every change, from any device or tool. Tests run as
# three separate legs (America/Denver, UTC, America/Los_Angeles) rather than
# one — see the comment above the Tests steps below for why a single pinned
# timezone can't be trusted to catch a timezone-dependent bug.
#
# Deliberately NO secrets in here: the env values below are dummies. The
# gauntlet never talks to a real database (tests are pure by design — the
# loginRateLimitPolicy split exists exactly so `npm test` can't reach a
# database), and every page is force-dynamic so `next build` renders no
# data. If a future change makes any of these steps need a *real* secret,
# treat that as a design smell to fix in the change, not a reason to add
# secrets to CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gauntlet:
    name: Gauntlet
    runs-on: ubuntu-latest
    env:
      # Dummy values, never real. DATABASE_URL points at a host that does
      # not exist in CI; nothing in the gauntlet connects to it.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      SESSION_SECRET: "ci-dummy-session-secret-not-used-anywhere-real"
      VOICE_API_TOKEN: "ci-dummy-voice-token"
      ALEXA_SKILL_ID: "amzn1.ask.skill.00000000-0000-0000-0000-000000000000"
    steps:
      - uses: actions/checkout@v4
        with:
          # recordcheck (below) diffs a commit range. The default shallow
          # clone has no parent to diff against, so the step would find
          # nothing and report clean — a check that cannot fail.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm ci also runs the postinstall `prisma generate` (schema-only,
      # no database contact).
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Tests (America/Denver)
        run: npm test
      # npm test pins TZ=America/Denver INSIDE the script, so `TZ=UTC npm
      # test` would silently still run Denver — these two extra legs use
      # the direct node invocation instead, the only way to actually
      # change the process timezone. Added for mission-13/CT1: the
      # all-day-event storage fix this phase makes lives entirely in the
      # difference between timezones (a bug invisible to a single pinned
      # zone), and CI must prove all three the gauntlet has always required
      # locally, not just one of them.
      - name: Tests (UTC)
        run: TZ=UTC node --import tsx --test src/lib/*.test.ts src/lib/voice/*.test.ts src/lib/testing/*.test.ts
      - name: Tests (America/Los_Angeles)
        run: TZ=America/Los_Angeles node --import tsx --test src/lib/*.test.ts src/lib/voice/*.test.ts src/lib/testing/*.test.ts
      - name: Build
        run: npm run build

      # The record gets checked like the code does.
      #
      # Added 2026-09-06, after a session audited CLAUDE.md for accuracy and
      # was gated three times — each pass finding a false claim that the FIX
      # for the previous one had introduced. None was in code. None would
      # have been caught by re-reading. All three were caught by running a
      # command against the claim, which is what this step does.
      #
      # It BLOCKS on one thing only: a commit hash in a record that does not
      # resolve. That is the single check measured to have zero false
      # positives across six real merges. Everything else prints as REVIEW
      # and does not block — the first cut also blocked on named-but-absent
      # files and on positional references, and would have failed FOUR of
      # those six merges on ordinary mission prose (a mission legitimately
      # names a file a contract proposes to create). A gate that cries wolf
      # gets tuned out, which is the very failure this step exists to reduce.
      #
      # So: read the REVIEW lines in the log. That is where every false claim
      # this was built for actually sat.
      - name: Record check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # A first push, a force-push or a squash can hand us a base that is
          # absent or all-zeros. Fall back to the parent rather than diffing
          # against nothing and reporting a vacuous pass.
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "base '${BASE}' not present; falling back to HEAD^"
            BASE="HEAD^"
          fi
          echo "range: ${BASE}..HEAD"
          node .claude/skills/avengers/recordcheck.mjs "${BASE}..HEAD"
